{% load presto %}
<div class="modal-backdrop" data-modal>
  <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
    <form hx-post="{{ action }}" hx-target="#modal" x-data="{ ack: false }">
      {% csrf_token %}
      <div class="modal-head"><h2 class="modal-title" id="modal-title">Reinitialize LDAP users?</h2></div>
      <div class="modal-body">
        {% if error %}<div class="alert" role="alert">{% icon "error" %}<span>{{ error }}</span></div>{% endif %}
        <p id="modal-desc">Deletes ALL LDAP-synced users (auth provider = ldap). Local accounts and your own account are kept. Re-run 'Sync LDAP Users' afterwards to repopulate them.</p>
        <div class="field field-switch">
          <label class="switch"><input type="checkbox" class="switch-input" name="confirm" value="1" x-model="ack">
            <span class="switch-track" aria-hidden="true"></span><span>I understand LDAP users will be deleted</span></label>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-flat" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-danger" :disabled="!ack">{% icon "restart_alt" %}Reinitialize</button>
      </div>
    </form>
  </div>
</div>
