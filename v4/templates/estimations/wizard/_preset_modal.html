{% load presto %}
<div class="modal-backdrop" data-modal>
  <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form hx-post="{{ action }}" hx-target="#modal" hx-include="#wizard-form" novalidate>
      <div class="modal-head">
        <h2 class="modal-title" id="modal-title">Save selection as preset</h2>
        <button type="button" class="btn-round sm" data-close-modal aria-label="Close">{% icon "close" %}</button>
      </div>
      <div class="modal-body">
        <p class="field-help ed-mono">{{ count }} feature(s) · product type: {{ pt }}</p>
        {% for error in form.non_field_errors %}<div class="alert" role="alert">{% icon "error" %}<span>{{ error }}</span></div>{% endfor %}
        {% for field in form %}{% include "web/crud/_field.html" %}{% endfor %}
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-flat" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">{% icon "save" %}Save</button>
      </div>
    </form>
  </div>
</div>
