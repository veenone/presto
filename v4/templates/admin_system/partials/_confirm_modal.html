{% load presto %}
<div class="modal-backdrop" data-modal>
  <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
    <form hx-post="{{ action_url }}" hx-target="#modal" novalidate>
      {% csrf_token %}
      <div class="modal-head">
        <h2 class="modal-title" id="modal-title">{{ m.title }}</h2>
        <button type="button" class="btn-round sm" data-close-modal aria-label="Close">{% icon "close" %}</button>
      </div>
      <div class="modal-body">
        {% if error %}<div class="alert" role="alert">{% icon "error" %}<span>{{ error }}</span></div>{% endif %}
        <p id="modal-desc" class="st-card-text">{{ m.text }}</p>
        {% if m.token %}
          <div class="field">
            <label class="field-label" for="confirm-token">Type {{ token_word }} to confirm</label>
            <input type="text" class="input ed-mono" id="confirm-token" name="confirm" placeholder="{{ token_word }}" autocomplete="off" spellcheck="false"{% if error %} aria-invalid="true"{% endif %}>
          </div>
        {% endif %}
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-flat" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-danger">{{ m.button }}</button>
      </div>
    </form>
  </div>
</div>
