{% extends "web/crud/page.html" %}
{% load presto %}
{% block toolbar_extra %}
  {% if can_create %}
    <button type="button" class="btn btn-flat btn-primary-text" hx-get="{{ list_path }}/new" hx-target="#modal" data-testid="add-request">
      {% icon "add" %}Add Request
    </button>
  {% endif %}
  {% if can_sync %}
    <button type="button" class="btn btn-flat btn-primary-text" hx-get="/requests/sync" hx-target="#modal" data-testid="import-requests">
      {% icon "sync" %}Import
    </button>
  {% endif %}
{% endblock %}
{% block filters_extra %}{% include "catalog/_select_filters.html" %}{% endblock %}
