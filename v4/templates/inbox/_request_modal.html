{% load presto %}
{# Add / edit request dialog (two columns like the v3 dialog; long fields span both). #}
<div class="modal-backdrop" data-modal>
  <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form hx-post="{{ action }}" hx-target="#modal" novalidate>
      {% csrf_token %}
      <div class="modal-head">
        <h2 class="modal-title" id="modal-title">{{ heading }}</h2>
        <button type="button" class="btn-round sm" data-close-modal aria-label="Close">{% icon "close" %}</button>
      </div>
      <div class="modal-body">
        {% for error in form.non_field_errors %}
          <div class="alert" role="alert">{% icon "error" %}<span>{{ error }}</span></div>
        {% endfor %}
        <div class="inb-form-grid">
          {% for field in form %}
            <div class="{% if field.name in form.wide_fields %}inb-span-2{% endif %}">{% include "web/crud/_field.html" %}</div>
          {% endfor %}
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-flat" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">{% if form.is_edit %}Save{% else %}Create{% endif %}</button>
      </div>
    </form>
  </div>
</div>
