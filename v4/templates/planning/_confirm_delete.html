{% load presto %}
<div class="modal-backdrop" data-modal>
  <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
    <form hx-post="{{ action }}" hx-target="#modal">
      {% csrf_token %}
      <div class="modal-head"><h2 class="modal-title" id="modal-title">Delete {{ noun }}</h2></div>
      <div class="modal-body">
        {% if error %}<div class="alert" role="alert">{% icon "error" %}<span>{{ error }}</span></div>{% endif %}
        <p id="modal-desc">Delete {{ label }}? This cannot be undone.{% if note %} {{ note }}{% endif %}</p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-flat" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-danger">{% icon "delete" %}Delete</button>
      </div>
    </form>
  </div>
</div>
