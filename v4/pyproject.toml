[project]
name = "presto"
version = "4.0.0.dev0"
description = "PRESTO - Test Effort Estimation Tool (Django)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.3,<2",
    "dj-database-url>=2.2",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "ldap3>=2.9",
    "authlib>=1.3",
    "requests>=2.31",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1"]
dev = ["pytest>=8.0", "pytest-django>=4.9", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["presto", "apps", "engine"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "presto.settings_test"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["v3compat: needs the v3 backend (backend/) to build a v3 database"]
# Deprecations in our code fail the suite; silence the ones raised inside third-party packages.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:tagMap is deprecated:DeprecationWarning",
    "ignore:typeMap is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Generated migrations and modules copied verbatim from v3 (kept byte-identical on purpose).
extend-exclude = [
    "apps/*/migrations",
    "engine",
    "tests/engine",
    "apps/integrations/adapters",
    "apps/imports/csv_importer.py",
    "apps/reports/excel_report.py",
    "apps/reports/word_report.py",
    "apps/reports/pdf_report.py",
    "apps/reports/executive_summary.py",
    "apps/reports/comparison_report.py",
    "apps/reports/trend_report.py",
    "apps/reports/templates.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
